{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso medico | OZONO SALUD</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=12" />
  </head>
  <body class="public-page">
    <main class="auth-shell">
      <section class="panel auth-panel">
        <img src="{% static 'logo.png' %}" alt="OZONO SALUD" />
        <div>
          <p class="eyebrow">Panel medico</p>
          <h1>Ingreso seguro</h1>
        </div>
        {% if form.errors %}
          <p class="form-message error">Usuario o contrasena incorrectos.</p>
        {% endif %}
        <form method="post" class="patient-form">
          {% csrf_token %}
          <label>
            Usuario
            {{ form.username }}
          </label>
          <label>
            Contrasena
            {{ form.password }}
          </label>
          <button class="primary-action full" type="submit">Ingresar</button>
        </form>
      </section>
    </main>
  </body>
</html>
