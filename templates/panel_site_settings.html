<!doctype html>
{% load static %}
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurar sitio | OZONO SALUD</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=12" />
  </head>
  <body class="staff-page" style="--watermark-url: url('{{ profile.watermark_src }}');">
    <div class="staff-shell">
      <aside class="staff-sidebar">
        <img src="{{ profile.logo_src }}" alt="{{ profile.title|default:'OZONO SALUD' }}" />
        <nav class="staff-nav">
          <a href="{% url 'doctor_panel' %}">Consultas</a>
          <a href="{% url 'panel_publications' %}">Publicaciones</a>
          <a href="{% url 'panel_site_settings' %}" class="active">Sitio y Zoom</a>
        </nav>
      </aside>

      <main class="staff-main">
        <header class="staff-header">
          <div>
            <p class="eyebrow">Contenido editable</p>
            <h1>Sitio, marca y Zoom</h1>
          </div>
          <div class="staff-actions">
            <a class="ghost-action" href="/">Ver sitio publico</a>
            <form method="post" action="{% url 'doctor_logout' %}">
              {% csrf_token %}
              <button class="ghost-action" type="submit">Cerrar sesion</button>
            </form>
          </div>
        </header>

        <section class="panel">
          <form method="post" enctype="multipart/form-data" class="panel-form">
            {% csrf_token %}
            <div class="form-grid">
              {% for field in form %}
                <label class="{% if field.field.widget.input_type == 'file' or field.name == 'about' or field.name == 'mission' %}span-2{% endif %}">
                  {{ field.label }}
                  {{ field }}
                  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
                  {% for error in field.errors %}<span class="form-message error">{{ error }}</span>{% endfor %}
                </label>
              {% endfor %}
            </div>
            <div class="note-actions">
              <button class="primary-action" type="submit">Guardar cambios</button>
              <a class="ghost-action" href="{% url 'doctor_panel' %}">Volver</a>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
